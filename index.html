<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>給恩恩的小角落 ❤️ </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: linear-gradient(
                135deg,
                #fff5f7,
                #ffe9ef
            );

            color: #555;
        }

        .container {
            width: min(90%, 600px);
            padding: 50px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.85);

            border-radius: 24px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .heart {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 15px;

            font-size: 32px;
            font-weight: 600;

            color: #d96b83;
        }

        p {
            margin: 10px 0;
            line-height: 1.8;
        }

        .subtitle {
            font-size: 18px;
        }

        .status {
            margin-top: 30px;
            padding-top: 20px;

            border-top: 1px solid #f1d8de;

            font-size: 14px;
            color: #999;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="heart">
            ❤️
        </div>

        <h1>
            給恩恩的小角落
        </h1>

        <p class="subtitle">
            這裡會記錄我們的點點滴滴。
        </p>

        <p>
            還有好多好多故事，<br>
            等著我們一起寫下來。
        </p>

        <div class="status">
            YuN · Our little story
        </div>

    </main>

</body>

</html>
